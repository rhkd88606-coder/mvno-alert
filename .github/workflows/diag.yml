name: diag
on: workflow_dispatch
jobs:
  catchup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import checker
          for no, title in [(519180, "알뜰폰 모음 사이트 완성했다 (+여행용 이심 비교)"), (519436, "어그래 헬모형 다시왔어~"), (519841, "쉐이크 122 셀프통수 완료 ㅋㅋㅋㅋ")]:
              checker.send_discord({"no": no, "head": "행사🆕", "title": title}, ["놓쳤던 '행사' 글 다시 알림"])
          PY
